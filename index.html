<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="체험단 보드">
<title>우리 체험단 보드</title>
<script src="config.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* 레이아웃: 위쪽 고정 바(탭 + 필터) · 아래 한 줄 카드 목록 · 편집은 아래에서 올라오는 시트 */
:root {
  --bg: #f4f5f8; --card: #ffffff; --ink: #1c1d24; --sub: #686b78; --line: #e2e4ea; --chip: #eceef3;
  --accent: #d6336c; --accent-soft: #fde8ef;
  --s-like: #d6336c; --s-apply: #4c5fd5; --s-pick: #2b8a3e; --s-done: #6b6f7c; --s-fail: #a0a3ad;
  --warn: #c92a2a; --shade: rgba(20, 20, 30, .45);
  --f-body: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15161b; --card: #1f2027; --ink: #eef0f5; --sub: #a3a6b3; --line: #30323c; --chip: #2a2c35;
  --accent: #f06595; --accent-soft: #3d1a28;
  --s-like: #f06595; --s-apply: #8c9bff; --s-pick: #69db7c; --s-done: #a3a6b3; --s-fail: #6f727e;
  --warn: #ff8787; --shade: rgba(0, 0, 0, .6); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #15161b; --card: #1f2027; --ink: #eef0f5; --sub: #a3a6b3; --line: #30323c; --chip: #2a2c35;
  --accent: #f06595; --accent-soft: #3d1a28;
  --s-like: #f06595; --s-apply: #8c9bff; --s-pick: #69db7c; --s-done: #a3a6b3; --s-fail: #6f727e;
  --warn: #ff8787; --shade: rgba(0, 0, 0, .6); color-scheme: dark; }
* { box-sizing: border-box; }
html { color-scheme: light; }
body { margin: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header .wrap { padding-block: 16px 4px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 21px; font-weight: 700; text-wrap: balance; }
.meta { color: var(--sub); font-size: 12.5px; }
.names { margin-left: auto; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar .wrap { padding-block: 8px 10px; display: flex; flex-direction: column; gap: 8px; }
.tabs { display: flex; gap: 4px; background: var(--chip); padding: 3px; border-radius: 10px; }
.tab { flex: 1; border: 0; background: transparent; color: var(--sub); font: inherit; font-weight: 600; padding: 7px 0; border-radius: 8px; cursor: pointer; }
.tab.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.tab b { color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { border: 0; background: var(--chip); color: var(--ink); border-radius: 999px; padding: 4px 11px; font: inherit; font-size: 13.5px; cursor: pointer; }
.chip.on { background: var(--ink); color: var(--bg); }
select, input[type=search], input[type=date], input[type=text], textarea {
  font: inherit; font-size: 14px; padding: 6px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); min-width: 0; }
input[type=search] { flex: 1 1 160px; }
label.tog { font-size: 13.5px; color: var(--sub); display: flex; gap: 4px; align-items: center; cursor: pointer; }
.count { font-size: 13px; color: var(--sub); margin-left: auto; font-variant-numeric: tabular-nums; }
button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.notice { background: var(--accent-soft); color: var(--ink); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; }
main .wrap { padding-block: 12px 48px; display: flex; flex-direction: column; gap: 8px; }
.item { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; }
.item.marked { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.item > div { min-width: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; font-size: 11.5px; }
.tag { background: var(--chip); color: var(--sub); border-radius: 4px; padding: 0 6px; }
.tag.t1 { background: var(--s-pick); color: var(--card); font-weight: 700; }
.tag.t2 { color: var(--s-pick); font-weight: 700; box-shadow: inset 0 0 0 1px var(--s-pick); background: transparent; }
.tag.soon { background: var(--warn); color: var(--card); font-weight: 700; }
.tag.new { background: var(--accent); color: var(--card); font-weight: 700; }
.tag.duo { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.tag.extra { color: var(--warn); font-weight: 700; box-shadow: inset 0 0 0 1px var(--warn); background: transparent; }
.title { font-weight: 600; color: var(--ink); text-decoration: none; display: block; margin-top: 2px; overflow-wrap: anywhere; }
.title:hover { text-decoration: underline; }
.offer { color: var(--sub); font-size: 13px; overflow-wrap: anywhere; }
.stat { color: var(--sub); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.stat .low { color: var(--s-pick); font-weight: 700; }
.side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.heart { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--sub); font-size: 19px; cursor: pointer; line-height: 1; }
.heart.on { background: var(--accent); border-color: var(--accent); color: var(--card); }
.badge { font-size: 12px; font-weight: 700; border-radius: 6px; padding: 1px 7px; color: var(--card); white-space: nowrap; cursor: pointer; border: 0; font-family: inherit; }
.st-찜 { background: var(--s-like); } .st-지원함 { background: var(--s-apply); } .st-선정 { background: var(--s-pick); }
.st-리뷰완료 { background: var(--s-done); } .st-탈락 { background: var(--s-fail); }
.more { align-self: center; }
.empty { text-align: center; color: var(--sub); padding: 36px 0; }
/* 우리 목록 */
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sum { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.sum b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.sum span { color: var(--sub); font-size: 12.5px; }
h2 { font-size: 15px; margin: 14px 0 0; display: flex; align-items: center; gap: 8px; }
h2 small { color: var(--sub); font-weight: 400; }
.plan { font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-variant-numeric: tabular-nums; }
.plan .due-soon { color: var(--warn); font-weight: 700; }
.memo { font-size: 13px; color: var(--sub); white-space: pre-wrap; overflow-wrap: anywhere; }
/* 편집 시트 */
.shade { position: fixed; inset: 0; background: var(--shade); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--card); width: 100%; max-width: 560px; border-radius: 16px 16px 0 0; max-height: 92%; overflow: auto;
  padding: 16px max(16px, env(safe-area-inset-left, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 10px; }
.sheet h3 { margin: 0; font-size: 16px; overflow-wrap: anywhere; }
.sheet .lab { font-size: 12.5px; color: var(--sub); font-weight: 600; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.two label, .field { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--sub); font-weight: 600; }
textarea { min-height: 64px; resize: vertical; }
.actions { display: flex; gap: 8px; align-items: center; }
.actions .grow { flex: 1; }
.btn { font: inherit; font-weight: 600; border-radius: 10px; padding: 8px 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--card); }
.btn.danger { color: var(--warn); }
.err { color: var(--warn); font-size: 13px; margin: 0; }
.apply { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.apply textarea { min-height: 150px; line-height: 1.6; }
.hint { color: var(--sub); font-size: 12.5px; margin: 0; }
@media (max-width: 420px) { .summary { gap: 6px; } .sum b { font-size: 19px; } }
@media (prefers-reduced-motion: no-preference) { .heart { transition: transform .15s; } .heart:active { transform: scale(.88); } }
</style>
</head>
<body>

<header><div class="wrap">
  <h1>우리 체험단 보드</h1>
  <span class="meta" id="meta">공고 불러오는 중…</span>
  <button class="chip names" id="namesBtn" hidden>이름 바꾸기</button>
</div></header>

<div class="bar"><div class="wrap">
  <div class="tabs">
    <button class="tab on" id="tabFind">공고 찾기</button>
    <button class="tab" id="tabOurs">우리 목록 <b id="oursCount"></b></button>
  </div>
  <div id="findFilters" class="row" style="flex-direction:column;align-items:stretch;gap:8px">
    <div class="row" id="catRow"></div>
    <div class="row" id="tierRow"></div>
    <div class="row">
      <select id="sido" aria-label="지역"><option value="">전체 지역</option></select>
      <select id="site" aria-label="사이트"><option value="">전체 사이트</option></select>
      <select id="channel" aria-label="리뷰 올릴 곳">
        <option value="블로그" selected>블로그 공고만</option>
        <option value="">모든 채널</option>
        <option value="인스타">인스타 공고만</option>
        <option value="클립">클립 공고만</option>
      </select>
      <select id="sort" aria-label="정렬">
        <option value="near">가까운 곳 먼저</option>
        <option value="deadline">마감 임박순</option>
        <option value="ratio">경쟁률 낮은순</option>
        <option value="new">새 공고순</option>
      </select>
      <input type="search" id="q" placeholder="가게 이름·동네·메뉴">
    </div>
    <div class="row">
      <label class="tog"><input type="checkbox" id="onlyDuo"> 둘이 가는 곳 (2인 제공)<span id="duoCount"></span></label>
      <label class="tog"><input type="checkbox" id="hideExtra" checked> 돈 더 내야 하는 곳 숨기기<span id="extraCount"></span></label>
      <label class="tog"><input type="checkbox" id="onlyNew"> 오늘 새 공고</label>
      <label class="tog"><input type="checkbox" id="hideCrowded"> 경쟁률 10:1 넘는 것 숨기기</label>
      <label class="tog"><input type="checkbox" id="hideMarked"> 이미 담은 것 숨기기</label>
      <span class="count" id="count"></span>
    </div>
  </div>
</div></div>

<main><div class="wrap" id="list"><div class="empty">공고를 불러오는 중이에요.</div></div></main>

<div class="shade" id="sheet" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
  <h3 id="shTitle"></h3>
  <div class="offer" id="shSub"></div>
  <span class="lab">상태</span><div class="seg" id="shStatus"></div>
  <span class="lab">누가 가나</span><div class="seg" id="shWho"></div>
  <div class="two">
    <label>방문일<input type="date" id="shVisit"></label>
    <label>리뷰 마감일<input type="date" id="shDue"></label>
  </div>
  <label class="field">메모<textarea id="shMemo" placeholder="예: 토요일 저녁 7시 예약, 주차 2시간 무료"></textarea></label>
  <div class="apply" id="applyBox">
    <div class="actions"><span class="lab">신청 사유</span><span class="grow"></span><button class="btn" id="apMake">초안 만들기</button></div>
    <textarea id="apText" hidden></textarea>
    <div class="actions" id="apActs" hidden>
      <span class="hint" id="apLen"></span><span class="grow"></span>
      <button class="btn" id="apCopy">복사</button>
      <button class="btn primary" id="apGo">복사하고 사이트 열기</button>
    </div>
    <p class="hint" id="apMsg" hidden></p>
  </div>
  <div class="apply" id="rvBox" hidden>
    <div class="actions"><span class="lab">블로그 리뷰 초안</span><span class="grow"></span><button class="btn" id="rvMake">초안 만들기</button></div>
    <p class="hint">위에 적은 방문일·누가·메모가 들어가요. [사진: …] 자리에 사진을 넣고 ( ) 안을 우리 경험으로 채우세요.</p>
    <textarea id="rvText" hidden></textarea>
    <div class="actions" id="rvActs" hidden><span class="grow"></span><button class="btn primary" id="rvCopy">복사</button></div>
    <p class="hint" id="rvMsg" hidden></p>
  </div>
  <p class="err" id="shErr" hidden></p>
  <div class="actions">
    <button class="btn danger" id="shDel">목록에서 빼기</button>
    <span class="grow"></span>
    <button class="btn" id="shClose">닫기</button>
    <button class="btn primary" id="shSave">저장</button>
  </div>
</div></div>

<div class="shade" id="keySheet" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="keyTitle">
  <h3 id="keyTitle">우리 둘 암호</h3>
  <div class="offer">찜·일정을 보고 저장하려면 구글 시트에 정해 둔 암호를 넣어 주세요. 이 기기에서는 한 번만 넣으면 됩니다.</div>
  <label class="field">암호<input type="password" id="keyInput" autocomplete="current-password"></label>
  <p class="err" id="keyErr" hidden></p>
  <div class="actions"><span class="grow"></span><button class="btn" id="keyClose">나중에</button><button class="btn primary" id="keySave">확인</button></div>
</div></div>

<div class="shade" id="nameSheet" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="nmTitle">
  <h3 id="nmTitle">우리 둘 이름</h3>
  <div class="offer">「누가 가나」 버튼에 쓰여요. 둘 중 누가 바꿔도 같이 바뀝니다.</div>
  <div class="two">
    <label>한 사람<input type="text" id="nmA" maxlength="10"></label>
    <label>다른 한 사람<input type="text" id="nmB" maxlength="10"></label>
  </div>
  <label class="field">우리 블로그 주소 (신청 사유 끝에 붙어요 · 이 기기에만 저장)<input type="url" id="nmBlog" placeholder="https://blog.naver.com/..."></label>
  <p class="err" id="nmErr" hidden></p>
  <div class="actions"><span class="grow"></span><button class="btn" id="nmClose">닫기</button><button class="btn primary" id="nmSave">저장</button></div>
</div></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CATS = ["전체", "맛집", "숙소", "화장품", "시술", "기타"];
const TIERS = [[1, "1순위 (우리 동네)"], [2, "2순위"], [3, "먼 곳"], [0, "지역 무관"]];
const STATUSES = ["찜", "지원함", "선정", "리뷰완료", "탈락"];
const PAGE = 60;
// 공고 페이지를 로그인해야 보여 주는 사이트 (11/20 확인: 링크를 열면 로그인 화면 → 로그인하면 그 공고로 이동)
const LOGIN_SITES = ["레뷰", "미블"];
const loginTag = s => LOGIN_SITES.includes(s) ? `<span class="tag extra">열면 ${esc(s)} 로그인 먼저</span>` : "";
// 제공 내역에 「2인」「1~2인」「2~3인」「2인분」「커플」이 있으면 둘이 갈 수 있는 공고로 본다 (12인 같은 큰 숫자는 제외)
const DUO = /(^|[^\d])2\s*(인|[~-]\s*\d\s*인)|커플/;
const today = new Date(); today.setHours(0, 0, 0, 0);
const pad = n => String(n).padStart(2, "0");
const todayStr = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;
const daysTo = s => s ? Math.round((new Date(s + "T00:00:00") - today) / 86400000) : null;
const dLabel = d => d === null ? "" : d === 0 ? "오늘" : d > 0 ? `D-${d}` : `${-d}일 지남`;
const md = s => s ? `${+s.slice(5, 7)}/${+s.slice(8, 10)}` : "";

const S = { all: [], byId: new Map(), marks: new Map(), people: { a: "", b: "" },
  tab: "find", cat: "전체", tiers: new Set([1, 2, 0]), shown: PAGE,
  ready: false, canWrite: false, marksReady: false, editing: null };
const whoName = w => w === "a" ? (S.people.a || "한 사람") : w === "b" ? (S.people.b || "다른 한 사람") : w === "both" ? "같이" : "";
const ratio = c => c.recruit ? (c.applied ?? 0) / c.recruit : null;

// ---------- 공고 데이터
async function loadCampaigns() {
  try {
    const res = await fetch("campaigns.json");
    const j = await res.json();
    S.all = j.rows.map(r => ({ id: r[0], site: j.sites[r[1]], url: r[2], title: r[3], offer: r[4], kind: r[5], channel: r[6],
      category: r[7], sido: r[8], region: r[9], tier: r[10] ?? 0, deadline: r[11], applied: r[12], recruit: r[13], point: r[14], first_seen: r[15], extra: r[16] || "" }))
      .filter(c => !c.deadline || c.deadline >= todayStr);
    S.all.forEach(c => { S.byId.set(c.id, c); c.duo = DUO.test(`${c.offer} ${c.point} ${c.title}`); });
    $("duoCount").textContent = ` ${S.all.filter(c => c.duo).length.toLocaleString()}`;
    $("extraCount").textContent = ` ${S.all.filter(c => c.extra).length.toLocaleString()}`;
    $("meta").textContent = `${j.at} 수집 · ${S.all.length.toLocaleString()}건`;
    const failed = (j.report || []).filter(r => r.includes("실패"));
    const stale = j.at.slice(0, 10) < todayStr;
    if (failed.length || stale) dataNotice = [stale ? `공고가 ${j.at.slice(5, 10).replace("-", "/")} 수집분이에요. 오늘 아침 자동 수집이 아직 반영되지 않았어요.` : "",
      failed.length ? `이번 수집에서 못 가져온 사이트: ${failed.join(", ")}` : ""].filter(Boolean).join(" ");
    const fill = (id, vals) => [...new Set(vals.filter(Boolean))].sort().forEach(v => $(id).insertAdjacentHTML("beforeend", `<option>${esc(v)}</option>`));
    fill("sido", S.all.map(c => c.sido)); fill("site", S.all.map(c => c.site));
    catChips(); tierChips(); render();
  } catch (e) {
    $("meta").textContent = "공고 데이터를 못 불러왔어요";
    $("list").innerHTML = `<div class="empty">공고 파일(campaigns.json)을 읽지 못했어요. 새로고침해 보세요.</div>`;
  }
}

function catChips() {
  $("catRow").innerHTML = CATS.map(v => {
    const n = v === "전체" ? S.all.length : S.all.filter(c => c.category === v).length;
    return `<button class="chip${S.cat === v ? " on" : ""}" data-v="${v}">${v} ${n.toLocaleString()}</button>`;
  }).join("");
}
function tierChips() {
  $("tierRow").innerHTML = TIERS.map(([t, label]) => {
    const n = S.all.filter(c => c.tier === t).length;
    return `<button class="chip${S.tiers.has(t) ? " on" : ""}" data-t="${t}">${label} ${n.toLocaleString()}</button>`;
  }).join("");
}
$("catRow").onclick = e => { const b = e.target.closest("button"); if (!b) return; S.cat = b.dataset.v; S.shown = PAGE; catChips(); render(); };

function filtered() {
  const q = $("q").value.trim().toLowerCase(), sido = $("sido").value, site = $("site").value;
  const channel = $("channel").value, hideExtra = $("hideExtra").checked;
  const onlyDuo = $("onlyDuo").checked, onlyNew = $("onlyNew").checked, hideCrowded = $("hideCrowded").checked, hideMarked = $("hideMarked").checked;
  const r = S.all.filter(c =>
    (S.cat === "전체" || c.category === S.cat) && S.tiers.has(c.tier) &&
    (!sido || c.sido === sido) && (!site || c.site === site) &&
    (!channel || c.channel === channel) && (!hideExtra || !c.extra) &&
    (!onlyDuo || c.duo) && (!onlyNew || c.first_seen === todayStr) && (!hideCrowded || (ratio(c) ?? 0) <= 10) &&
    (!hideMarked || !S.marks.has(c.id)) &&
    (!q || `${c.title} ${c.offer} ${c.region} ${c.sido}`.toLowerCase().includes(q)));
  const big = 1e9, s = $("sort").value, dl = c => daysTo(c.deadline) ?? big;
  const rank = c => ({ 1: 0, 0: 1, 2: 2, 3: 3 })[c.tier];
  if (s === "near") r.sort((a, b) => rank(a) - rank(b) || dl(a) - dl(b));
  if (s === "deadline") r.sort((a, b) => dl(a) - dl(b));
  if (s === "ratio") r.sort((a, b) => (ratio(a) ?? big) - (ratio(b) ?? big));
  if (s === "new") r.sort((a, b) => b.first_seen.localeCompare(a.first_seen));
  return r;
}

function findCard(c) {
  const m = S.marks.get(c.id), d = daysTo(c.deadline), rt = ratio(c);
  const tierTag = c.tier === 1 ? `<span class="tag t1">1순위</span>` : c.tier === 2 ? `<span class="tag t2">2순위</span>` : "";
  const tags = [c.category, c.site, c.kind, c.channel, [c.sido, c.region].filter(Boolean).join(" ")].filter(Boolean);
  return `<article class="item${m ? " marked" : ""}">
    <div>
      <div class="tags">${tierTag}${d !== null ? `<span class="tag${d <= 2 ? " soon" : ""}">마감 ${dLabel(d)}</span>` : ""}${c.first_seen === todayStr ? `<span class="tag new">NEW</span>` : ""}${c.duo ? `<span class="tag duo">2인</span>` : ""}${c.extra ? `<span class="tag extra">추가 지출 · ${esc(c.extra)}</span>` : ""}${loginTag(c.site)}${tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      <a class="title" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>
      <div class="offer">${esc(c.offer)}${c.point ? " · " + esc(c.point) : ""}</div>
      <div class="stat">신청 ${c.applied ?? "-"} / 모집 ${c.recruit ?? "-"}${rt !== null ? ` · <span class="${rt <= 1 ? "low" : ""}">${rt.toFixed(1)}:1</span>` : ""}</div>
    </div>
    <div class="side">
      ${S.canWrite ? `<button class="heart${m ? " on" : ""}" data-heart="${c.id}" aria-label="${m ? "담은 공고 편집" : "우리 목록에 담기"}">${m ? "♥" : "♡"}</button>` : ""}
      ${m ? `<button class="badge st-${m.status}" data-edit="${c.id}">${m.status}${m.who ? " · " + esc(whoName(m.who)) : ""}</button>` : ""}
    </div>
  </article>`;
}

// ---------- 우리 목록
function oursItem(id, m) {
  const c = S.byId.get(id);
  const dv = daysTo(m.visit), dd = daysTo(m.due), dl = daysTo(m.dl);
  const plan = [];
  if (m.status === "찜" || m.status === "지원함") { if (m.dl) plan.push(`<span class="${dl !== null && dl <= 2 ? "due-soon" : ""}">모집 마감 ${md(m.dl)} (${dLabel(dl)})</span>`); }
  if (m.visit) plan.push(`<span>방문 ${md(m.visit)} (${dLabel(dv)})</span>`);
  if (m.due && m.status !== "리뷰완료") plan.push(`<span class="${dd !== null && dd <= 3 ? "due-soon" : ""}">리뷰 마감 ${md(m.due)} (${dLabel(dd)})</span>`);
  return `<article class="item marked">
    <div>
      <div class="tags">${[m.c, m.s, m.r].filter(Boolean).map(t => `<span class="tag">${esc(t)}</span>`).join("")}${loginTag(m.s)}${!c &&(m.status === "찜" || m.status === "지원함") ? `<span class="tag">모집 끝남</span>` : ""}</div>
      <a class="title" href="${esc(m.u)}" target="_blank" rel="noopener">${esc(m.t)}</a>
      ${plan.length ? `<div class="plan">${plan.join("")}</div>` : ""}
      ${m.memo ? `<div class="memo">${esc(m.memo)}</div>` : ""}
    </div>
    <div class="side"><button class="badge st-${m.status}" data-edit="${id}">${m.status}${m.who ? " · " + esc(whoName(m.who)) : ""}</button></div>
  </article>`;
}

function renderOurs() {
  const entries = [...S.marks.entries()];
  $("count").textContent = "";
  if (!S.ready) { $("list").innerHTML = banner() || `<div class="empty">구글 시트에 연결되지 않았어요.</div>`; return; }
  if (!S.marksReady && !entries.length) { $("list").innerHTML = banner() + `<div class="empty">우리 목록을 불러오는 중이에요.</div>`; return; }
  if (!entries.length) { $("list").innerHTML = banner() + `<div class="empty">아직 담은 공고가 없어요.<br>「공고 찾기」에서 ♡ 를 누르면 여기에 모여요. 둘 중 누가 담아도 같이 보여요.</div>`; return; }
  const by = st => entries.filter(([, m]) => m.status === st);
  const picked = by("선정");
  const weekVisits = picked.filter(([, m]) => { const d = daysTo(m.visit); return d !== null && d >= 0 && d <= 7; }).length;
  const dueSoon = picked.filter(([, m]) => { const d = daysTo(m.due); return d !== null && d <= 3; }).length;
  const key = (m, f) => m[f] || "9999";
  const order = {
    "선정": (a, b) => key(a[1], "visit").localeCompare(key(b[1], "visit")) || key(a[1], "due").localeCompare(key(b[1], "due")),
    "지원함": (a, b) => key(a[1], "dl").localeCompare(key(b[1], "dl")),
    "찜": (a, b) => key(a[1], "dl").localeCompare(key(b[1], "dl")),
    "리뷰완료": (a, b) => (b[1].at || "").localeCompare(a[1].at || ""),
    "탈락": (a, b) => (b[1].at || "").localeCompare(a[1].at || ""),
  };
  const sections = ["선정", "지원함", "찜", "리뷰완료", "탈락"].map(st => {
    const list = by(st).sort(order[st]);
    if (!list.length) return "";
    return `<h2><span class="badge st-${st}" style="cursor:default">${st}</span><small>${list.length}건</small></h2>` + list.map(([id, m]) => oursItem(id, m)).join("");
  }).join("");
  $("list").innerHTML = banner() + `<div class="summary">
      <div class="sum"><b>${picked.length}</b><span>선정되어 진행 중</span></div>
      <div class="sum"><b>${weekVisits}</b><span>7일 안에 방문</span></div>
      <div class="sum"><b>${dueSoon}</b><span>리뷰 마감 3일 이내</span></div>
    </div>` + sections;
}

// ---------- 신청 사유 초안
// 공고 정보(분야·동네·2인 여부·누가 가나)로 문장을 고른다. 같은 문장을 여러 곳에 붙이지 않도록 공고마다 표현이 달라진다.
// 시술은 의료광고 주의 — 효과를 약속하는 말을 쓰지 않는다.
const pick = (arr, seed) => arr[(parseInt(seed, 16) || 0) % arr.length];
const hasBatchim = w => { const ch = (w || "").trim().slice(-1).charCodeAt(0); return ch >= 0xAC00 && ch <= 0xD7A3 ? (ch - 0xAC00) % 28 !== 0 : null; };
const josa = (w, withB, without) => { const b = hasBatchim(w); return w + (b === null ? `${withB}(${without})` : b ? withB : without); };
const storeName = t => (t || "").replace(/\[[^\]]*\]/g, "").replace(/\s+/g, " ").trim() || "이곳";

function draftReason(id, m) {
  const c = S.byId.get(id) || {};
  const name = storeName(m.t), area = (m.r || "").trim(), cat = m.c || c.category || "기타";
  const together = m.who === "both" || (!m.who && c.duo);
  const delivered = c.kind === "배송형" || cat === "화장품";
  const sd = (id + "000000000000").replace(/[^0-9a-f]/gi, "0");
  const s1 = sd.slice(0, 3), s2 = sd.slice(3, 6), s3 = sd.slice(6, 9);
  let open, body, detail;
  if (cat === "맛집") {
    open = pick([
      `${area ? area + " 쪽에서 " : ""}맛집을 찾다가 ${josa(name, "을", "를")} 알게 되어 신청합니다.`,
      `${area ? josa(area, "은", "는") + " 저희가 자주 다니는 동네라 " : ""}${name} 체험단 모집이 반가워 신청합니다.`,
      `${josa(name, "은", "는")} 꼭 한번 가 보고 싶었던 곳이라 체험단 모집을 보고 바로 신청합니다.`], s1);
    body = together
      ? pick([`예비부부 둘이 함께 방문해 메뉴 구성과 맛, 양, 매장 분위기를 사진과 함께 꼼꼼하게 담겠습니다.`,
              `둘이 함께 가서 여러 메뉴를 나눠 먹어 보고, 맛과 양, 분위기를 사진과 함께 자세히 소개하겠습니다.`], s2)
      : `직접 방문해 메뉴별 맛과 양, 매장 분위기를 사진과 함께 꼼꼼하게 담겠습니다.`;
    detail = pick([`가격, 주차, 웨이팅, 좌석 구성처럼 처음 가는 분들이 궁금해할 정보도 빠짐없이 정리하겠습니다.`,
                   `위치와 주차, 영업시간, 추천 메뉴까지 실제로 가려는 분들께 도움이 되도록 정리하겠습니다.`], s3);
  } else if (cat === "숙소") {
    open = pick([`둘이 함께 쉬어 갈 곳을 찾다가 ${josa(name, "을", "를")} 보게 되어 신청합니다.`,
                 `${josa(name, "은", "는")} 저희가 머물러 보고 싶었던 곳이라 체험단 모집을 보고 신청합니다.`], s1);
    body = `객실 구성과 청결, 침구, 부대시설, 주변 동선까지 직접 머물며 느낀 그대로 사진과 함께 기록하겠습니다.`;
    detail = `체크인부터 체크아웃까지 순서대로 정리해 예약을 고민하는 분들께 도움이 되도록 쓰겠습니다.`;
  } else if (cat === "시술") {
    open = pick([`${name}의 관리 과정이 궁금해 체험단에 신청합니다.`,
                 `평소 관심 있던 관리라 ${name} 체험단 모집을 보고 신청합니다.`], s1);
    body = `상담부터 관리 과정, 공간과 위생, 소요 시간까지 직접 받으며 경험한 그대로 담겠습니다.`;
    detail = `효과를 과장하지 않고 실제 경험 위주로, 처음 방문하는 분들이 참고하기 좋게 정리하겠습니다.`;
  } else if (delivered) {
    open = pick([`평소 제품을 꼼꼼히 비교해 보고 고르는 편이라 ${josa(name, "이", "가")} 궁금해 신청합니다.`,
                 `${name} 체험단 모집을 보고 직접 써 보고 싶어 신청합니다.`], s1);
    body = cat === "화장품"
      ? `제품을 받아 충분히 사용해 보고 제형, 사용감, 향, 패키지를 사진과 함께 솔직하게 담겠습니다.`
      : `제품을 받아 직접 사용해 보고 구성과 사용 방법, 좋았던 점과 아쉬운 점을 사진과 함께 솔직하게 담겠습니다.`;
    detail = `과장 없이 실제로 써 본 후기로 정리하겠습니다.`;
  } else {
    open = `${name} 체험단 모집을 보고 직접 경험해 보고 싶어 신청합니다.`;
    body = together ? `둘이 함께 방문해 공간과 진행 과정, 이용 방법을 사진과 함께 자세히 담겠습니다.`
                    : `직접 방문해 공간과 진행 과정, 이용 방법을 사진과 함께 자세히 담겠습니다.`;
    detail = `처음 이용하는 분들이 궁금해할 정보 위주로 정리하겠습니다.`;
  }
  const close = pick([`선정해 주시면 가이드라인과 일정을 지켜 정성껏 리뷰 올리겠습니다. 감사합니다.`,
                      `선정되면 안내해 주시는 가이드를 꼼꼼히 확인하고 기한 안에 성실하게 작성하겠습니다. 감사합니다.`], sd.slice(9, 12));
  const blog = store.get("board-blog");
  return [open, body, detail, close].join(" ") + (blog ? `\n블로그: ${blog}` : "");
}

function copyText(t) {

  try { navigator.clipboard.writeText(t).catch(fallback); } catch { fallback(); }
}

$("apCopy").onclick = () => { copyText($("apText").value); $("apMsg").textContent = "복사했어요. 체험단 사이트 신청란에 붙여 넣으세요."; $("apMsg").hidden = false; };
$("apGo").onclick = () => {
  const m = S.marks.get(S.editing); if (!m) return;
  copyText($("apText").value);
  if (m.u) window.open(m.u, "_blank", "noopener");
  if (draft.status === "찜") { draft.status = "지원함"; seg($("shStatus"), STATUSES.map(s => [s, s]), draft.status, "status"); }
  $("apMsg").textContent = "복사했어요. 사이트에서 붙여 넣고 신청을 마친 뒤 여기서 「저장」을 눌러 주세요. 상태는 「지원함」으로 바꿔 두었어요.";
  $("apMsg").hidden = false;
};

// ---------- 블로그 리뷰 초안 (선정 뒤)
// 공정위 「추천·보증 심사지침」: 글 첫머리에 경제적 대가 표기. 시술은 의료광고 주의 — 효과 단정·전후 비교를 쓰지 않는다.
function draftReview(id, m) {
  const c = S.byId.get(id) || {};
  const name = storeName(m.t), cat = m.c || c.category || "기타";
  const town = (m.r || "").split(" ").pop() || "";
  const offer = (c.offer || "").replace(/\s+/g, " ").trim();
  const delivered = c.kind === "배송형" || cat === "화장품";
  const whoTxt = m.who === "both" ? "둘이 함께" : m.who ? `${whoName(m.who)}${hasBatchim(whoName(m.who)) ? "이" : ""}가` : "";
  const when = m.visit ? `${+m.visit.slice(5, 7)}월 ${+m.visit.slice(8, 10)}일` : "(방문일)";
  const disclosure = `※ 이 글은 ${josa(m.s || "체험단", "을", "를")} 통해 ${name} 측으로부터 ${delivered ? "제품" : "서비스"}를 무료로 제공받아 직접 ${delivered ? "사용해" : "방문해"} 보고 솔직하게 작성한 후기입니다.`
    + (offer ? ` (제공 내역: ${offer.slice(0, 50).replace(/[\s/·,]+$/, "")})` : "");
  const tip = `(작성 전 확인: 체험단 사이트 가이드라인의 필수 키워드·사진 개수·지도/링크 첨부·리뷰 마감일${m.due ? ` ${md(m.due)}` : ""})`;
  const sec = (h, ...lines) => `\n■ ${h}\n` + lines.join("\n");
  let titles, body, tags;
  if (cat === "맛집") {
    titles = [`${town} 맛집 ${name}, ${whoTxt ? whoTxt.replace(/가$/, "") + " 다녀온 " : ""}솔직 후기`, `${name} | ${town}에서 (대표 메뉴) 먹고 온 후기`, `${town} 데이트 코스로 좋은 ${name} 방문기`];
    body = [
      sec("위치·주차·영업시간", "[사진: 외관·간판]", `${town}에 있는 ${name}에 ${when} ${whoTxt ? whoTxt + " " : ""}다녀왔어요.`, "주소: (확인 필요) / 영업시간: (확인 필요) / 주차: (가능 여부·시간)", "(찾아가는 길, 근처 역에서 걸린 시간)"),
      sec("매장 분위기", "[사진: 내부 전체] [사진: 좌석]", "(좌석 수·테이블 간격·조명·소음, 둘이 오기 좋은지)"),
      sec("메뉴와 가격", "[사진: 메뉴판]", "(대표 메뉴와 가격, 2인 기준 추천 조합)"),
      sec("먹어 본 메뉴", "[사진: 메뉴 1] [사진: 메뉴 2] [사진: 상차림]", "(메뉴별 맛·양·온도, 반찬이나 소스, 둘이 먹기에 양이 어땠는지)"),
      sec("총평", "좋았던 점: ( )", "아쉬운 점: ( )", "이런 분께 추천: ( )")];
    tags = [`${town}맛집`, name.replace(/\s/g, ""), `${town}데이트`, `${town}밥집`, "체험단"];
  } else if (cat === "숙소") {
    titles = [`${name} 숙박 후기 | ${town} ${whoTxt ? "커플 " : ""}여행`, `${town} 숙소 ${name}, 객실·부대시설 솔직 후기`];
    body = [
      sec("위치·체크인", "[사진: 외관] [사진: 로비]", `${when}에 ${whoTxt ? whoTxt + " " : ""}1박 했어요.`, "주소: (확인 필요) / 체크인·체크아웃: ( ) / 주차: ( )"),
      sec("객실", "[사진: 객실 전체] [사진: 침구] [사진: 창밖 풍경]", "(객실 크기·청결·침구·냉난방·방음)"),
      sec("욕실·어메니티", "[사진: 욕실] [사진: 어메니티]", "(수압·온수·어메니티 구성)"),
      sec("부대시설·주변", "[사진: 부대시설]", "(조식·수영장·바베큐 등, 근처 가 볼 곳·식당)"),
      sec("총평", "좋았던 점: ( )", "아쉬운 점: ( )", "이런 분께 추천: ( )")];
    tags = [`${town}숙소`, name.replace(/\s/g, ""), `${town}여행`, "커플여행", "숙소추천", "체험단"];
  } else if (cat === "시술") {
    titles = [`${name} 방문 후기 | ${town} (관리 이름) 받아 본 과정`, `${town} ${name} 상담부터 관리까지 후기`];
    body = [
      "(의료광고 주의: '효과 보장·완벽·최고' 같은 단정, 다른 곳과의 비교, 시술 전후 비교 사진은 쓰지 않아요)",
      sec("위치·예약", "[사진: 외관·입구]", `${when}에 예약하고 방문했어요.`, "주소: (확인 필요) / 예약 방법: ( ) / 주차: ( )"),
      sec("공간·위생", "[사진: 대기 공간] [사진: 관리실]", "(대기 공간, 청결, 1인실 여부)"),
      sec("상담", "(어떤 내용을 물어봤고 어떻게 안내받았는지)"),
      sec("관리 과정", "[사진: 사용 제품·도구]", "(순서대로, 걸린 시간, 느낌 — 내가 느낀 경험만)"),
      sec("총평", "좋았던 점: ( )", "아쉬운 점: ( )", "(개인차가 있다는 점 한 줄)")];
    tags = [`${town}${"관리"}`, name.replace(/\s/g, ""), "체험단"];
  } else if (delivered) {
    titles = [`${name} 사용 후기 | (며칠) 써 본 솔직 리뷰`, `${name} 제형·사용감 리뷰`];
    body = [
      sec("구성", "[사진: 택배 개봉] [사진: 패키지] [사진: 구성품]", "(용량·가격·패키지)"),
      sec("제형·향", "[사진: 제형 발색 또는 덜어 낸 모습]", "(질감·향·흡수)"),
      sec("사용법", "(언제, 어떻게, 얼마나 썼는지)"),
      sec("사용감", "(며칠 써 보고 느낀 점 — 개인 경험으로만)"),
      sec("총평", "좋았던 점: ( )", "아쉬운 점: ( )", "이런 분께 추천: ( )")];
    tags = [name.replace(/\s/g, ""), "솔직후기", "체험단"];
  } else {
    titles = [`${name} 후기 | ${town} ${whoTxt ? "데이트로 " : ""}다녀온 곳`, `${town} ${name} 이용 후기`];
    body = [
      sec("위치·예약", "[사진: 외관]", `${when}에 ${whoTxt ? whoTxt + " " : ""}다녀왔어요.`, "주소: (확인 필요) / 운영시간: ( ) / 주차: ( )"),
      sec("공간", "[사진: 내부]", "(분위기·시설)"),
      sec("진행·이용 방법", "[사진: 진행 모습]", "(순서와 걸린 시간)"),
      sec("총평", "좋았던 점: ( )", "아쉬운 점: ( )", "이런 분께 추천: ( )")];
    tags = [`${town}가볼만한곳`, name.replace(/\s/g, ""), "체험단"];
  }
  const memo = m.memo ? `\n(우리 메모: ${m.memo})` : "";
  return [tip, "", "[제목 후보]", ...titles.map(t => "- " + t), "", "[본문]", disclosure, ...body, memo,
          "", "[해시태그]", tags.filter(Boolean).map(t => "#" + t.replace(/[^\w가-힣]/g, "")).join(" ")].join("\n").replace(/\n{3,}/g, "\n\n");
}
$("rvMake").onclick = () => {
  const m = S.marks.get(S.editing); if (!m) return;
  $("rvText").value = draftReview(S.editing, { ...m, who: draft.who, visit: $("shVisit").value, due: $("shDue").value, memo: $("shMemo").value.trim() });
  $("rvText").hidden = $("rvActs").hidden = false; $("rvMsg").hidden = true; $("rvMake").textContent = "다시 만들기";
};
$("rvCopy").onclick = () => {
  const t = $("rvText").value;
  try { navigator.clipboard.writeText(t).catch(() => { $("rvText").select(); document.execCommand("copy"); }); } catch { $("rvText").select(); }
  $("rvMsg").textContent = "복사했어요. 네이버 블로그 글쓰기에 붙여 넣고, 첫 줄 광고 표기는 지우지 마세요."; $("rvMsg").hidden = false;
};

// ---------- 이름
$("namesBtn").onclick = () => { $("nmA").value = S.people.a; $("nmB").value = S.people.b; $("nmBlog").value = store.get("board-blog"); $("nmErr").hidden = true; $("nameSheet").hidden = false; $("nmA").focus(); };
$("nmClose").onclick = () => { $("nameSheet").hidden = true; };
$("nameSheet").onclick = e => { if (e.target === $("nameSheet")) $("nameSheet").hidden = true; };
$("nmSave").onclick = async () => {
  store.set("board-blog", $("nmBlog").value.trim().slice(0, 200));
  const body = { a: $("nmA").value.trim().slice(0, 10), b: $("nmB").value.trim().slice(0, 10) };
  try { await api("people", { people: body }); S.people = body; $("nameSheet").hidden = true; render(); }
  catch (err) { $("nmErr").textContent = "저장하지 못했어요."; $("nmErr").hidden = false; }
};

// ---------- 구글 시트 연결 (주소는 config.js, 암호는 이 기기에만 저장)
const SHEET_URL = window.SHEET_URL || "";
const store = { get: k => { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
                set: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} } };
let KEY = store.get("board-key");

async function api(action, body = {}) {
  // text/plain 으로 보내야 구글 앱스 스크립트가 브라우저 사전 확인(CORS) 없이 받는다
  const res = await fetch(SHEET_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action, key: KEY, ...body }) });
  const j = await res.json();
  if (!j.ok) throw { code: j.error || "fail" };
  return j;
}
async function saveMark(id, body) {
  const prev = S.marks.get(id);
  S.marks.set(id, body); render();              // 먼저 화면에 반영하고
  try { await api("set", { mark: { id, ...body } }); }
  catch (err) { prev ? S.marks.set(id, prev) : S.marks.delete(id); render(); throw err; }  // 실패하면 되돌린다
}
async function removeMark(id) {
  const prev = S.marks.get(id);
  S.marks.delete(id); render();
  try { await api("delete", { id }); } catch (err) { if (prev) S.marks.set(id, prev); render(); throw err; }
}

let busy = false;
async function refresh() {
  if (!SHEET_URL || !KEY || busy || !$("sheet").hidden) return;  // 편집 중에는 덮어쓰지 않는다
  busy = true;
  try {
    const j = await api("list");
    S.marks = new Map(Object.entries(j.marks || {}).map(([id, m]) => [id, { ...m }]));
    S.people = { a: j.people?.a || "", b: j.people?.b || "" };
    S.ready = S.marksReady = true; S.canWrite = true; $("namesBtn").hidden = false;
    if (notice.startsWith("구글 시트")) notice = "";
  } catch (err) {
    if (err?.code === "key") { S.ready = false; S.canWrite = false; askKey("암호가 맞지 않아요. 다시 넣어 주세요."); }
    else notice = "구글 시트에서 우리 목록을 못 불러왔어요. 인터넷 연결을 확인해 주세요.";
  } finally { busy = false; render(); }
}

function askKey(msg) {
  $("keyErr").textContent = msg || ""; $("keyErr").hidden = !msg;
  $("keyInput").value = ""; $("keySheet").hidden = false; $("keyInput").focus();
}
$("keySave").onclick = () => { KEY = $("keyInput").value.trim(); store.set("board-key", KEY); $("keySheet").hidden = true; refresh(); };
$("keyInput").onkeydown = e => { if (e.key === "Enter") $("keySave").click(); };
$("keyClose").onclick = () => { $("keySheet").hidden = true; notice = "암호를 넣으면 찜·일정을 같이 볼 수 있어요."; render(); };

function connect() {
  if (!SHEET_URL) { notice = "아직 구글 시트가 연결되지 않았어요. 공고 보기만 됩니다."; render(); return; }
  if (!KEY) askKey(); else refresh();
  setInterval(() => { if (document.visibilityState === "visible") refresh(); }, 60000);   // 1분마다 상대가 바꾼 것 반영
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });
}

render();
loadCampaigns();
connect();
</script>
